<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>묘비명 남기기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --primary: #3182f6; --primary-strong: #2272eb;
    --canvas: #ffffff; --foreground: #191f28; --body: #4e5968; --muted: #8b95a1;
    --surface: #f2f4f6; --border: #e5e8eb; --on-primary: #ffffff;
    --weak-bg: #e8f3ff; --weak-fg: #1b64da; --danger: #e42939;
  }
  /* 다크 모드는 TDS 공식 값이 아닌 로컬 확장 */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --canvas: #17171c; --foreground: #f9fafb; --body: #d1d6db; --muted: #8b95a1;
      --surface: #26262c; --border: #333d4b; --weak-bg: #19264a; --weak-fg: #90c2ff;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; min-height: 100vh; background: var(--canvas); color: var(--foreground);
    font-family: "Pretendard Variable", Pretendard, "Noto Sans KR", sans-serif;
    font-size: 16px; line-height: 24px;
    display: flex; justify-content: center;
  }
  main {
    width: 100%; max-width: 480px; padding: 32px 24px 200px;
    display: flex; flex-direction: column; gap: 32px;
  }

  header .brand {
    display: inline-block; padding: 2px 8px; border-radius: 6px;
    background: var(--weak-bg); color: var(--weak-fg);
    font-size: 13px; line-height: 19.5px; font-weight: 600;
  }
  header h1 { margin: 16px 0 8px; font-size: 26px; line-height: 35px; font-weight: 700; }
  header p { margin: 0; color: var(--body); font-size: 17px; line-height: 25.5px; }

  .memorial { display: flex; flex-direction: column; gap: 12px; }
  .stone {
    background: var(--surface); border-radius: 120px 120px 16px 16px;
    padding: 64px 24px 40px; min-height: 280px; text-align: center;
    display: flex; flex-direction: column; justify-content: center; gap: 16px;
  }
  .stone .name { font-size: 22px; line-height: 31px; font-weight: 700; }
  .stone .epitaph {
    font-size: 17px; line-height: 25.5px; color: var(--body);
    white-space: pre-wrap; word-break: keep-all;
  }
  .placeholder { color: var(--muted) !important; }
  .stone .rip { color: var(--muted); font-size: 13px; line-height: 19.5px; letter-spacing: .2em; }

  .song { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .song img, .song .art {
    flex: none; width: 48px; height: 48px; border-radius: 10px; object-fit: cover;
    background: var(--weak-bg); color: var(--weak-fg); display: grid; place-items: center; font-size: 20px;
  }
  .song .meta { flex: 1; min-width: 0; }
  .song .title { font-size: 15px; line-height: 22.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .song .artist { font-size: 13px; line-height: 19.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .bgm {
    background: var(--surface); border-radius: 16px; padding: 16px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .bgm .label { font-size: 13px; line-height: 19.5px; color: var(--muted); }
  .play {
    flex: none; width: 44px; height: 44px; padding: 0; border-radius: 22px; font-size: 16px;
  }
  .bgm .player { aspect-ratio: 16 / 9; width: 100%; border: 0; border-radius: 10px; background: #000; }
  .bgm .links { display: flex; justify-content: space-between; gap: 12px; }
  .bgm a, .text-btn {
    color: var(--weak-fg); font-size: 14px; line-height: 21px; font-weight: 600; text-decoration: none;
    background: none; border: none; padding: 0; height: auto; cursor: pointer; font-family: inherit;
  }

  form { display: flex; flex-direction: column; gap: 24px; }
  .field label {
    display: flex; justify-content: space-between; margin-bottom: 8px;
    color: var(--body); font-size: 14px; line-height: 21px; font-weight: 600;
  }
  .field .count { color: var(--muted); font-weight: 400; }
  .field .help { margin: 8px 0 0; font-size: 13px; line-height: 19.5px; color: var(--muted); }
  .field .help.error { color: var(--danger); }
  input, textarea {
    width: 100%; padding: 14px 16px; font: inherit; font-size: 17px; line-height: 25.5px;
    color: var(--foreground); background: var(--surface);
    border: 1px solid transparent; border-radius: 14px; outline: none;
  }
  input::placeholder, textarea::placeholder { color: var(--muted); }
  input:focus, textarea:focus { border-color: var(--primary); background: var(--canvas); }
  input.invalid { border-color: var(--danger); }
  textarea { resize: none; height: 104px; }

  .results { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; }
  .results li button {
    width: 100%; height: auto; padding: 8px; border-radius: 14px; text-align: left;
    background: none; color: var(--foreground); font-weight: 400;
  }
  .results li button:hover { background: var(--surface); }
  .picked { margin-top: 8px; padding: 8px; border-radius: 14px; background: var(--weak-bg); }

  section h2 { margin: 0 0 12px; font-size: 17px; line-height: 25.5px; font-weight: 700; }
  .gifts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .card { background: var(--surface); border-radius: 16px; padding: 16px; }
  .card .label { font-size: 13px; line-height: 19.5px; color: var(--muted); }
  .card .text { margin-top: 4px; font-size: 17px; line-height: 25.5px; color: var(--body); white-space: pre-wrap; word-break: keep-all; }
  .locked {
    border: 1px dashed var(--grey300, #d1d6db); border-radius: 16px; padding: 24px 16px;
    text-align: center; color: var(--muted); font-size: 15px; line-height: 22.5px; word-break: keep-all;
  }

  .cta {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 24px 24px calc(16px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--canvas) 75%, transparent);
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  .cta > * { width: 100%; max-width: 432px; }
  button {
    height: 56px; padding: 0 20px; border: none; border-radius: 16px;
    background: var(--primary); color: var(--on-primary);
    font: inherit; font-size: 17px; font-weight: 600; cursor: pointer;
    transition: transform .1s;
  }
  button.weak { background: var(--weak-bg); color: var(--weak-fg); }
  button:active:not(:disabled) { transform: scale(0.96); }
  button:focus-visible { outline: none; box-shadow: 0 0 0 1px #8ac0ff, 0 0 0 3px #b8d9ff; }
  button:disabled { opacity: .4; cursor: default; }
  .status { margin: 0; text-align: center; color: var(--muted); font-size: 14px; line-height: 21px; min-height: 21px; }
  @media (prefers-reduced-motion: reduce) { button { transition: none; } }
</style>
</head>
<body>
<main>
  <header>
    <span class="brand">묘비명 남기기</span>
    <h1 id="headline">어떻게 기억되고 싶나요?</h1>
    <p id="subline">한 줄이면 충분해요. 묘비에 새길 말과 함께 들을 노래를 남겨주세요.</p>
  </header>

  <section class="memorial" aria-live="polite">
    <div class="stone">
      <div class="name" id="previewName"></div>
      <div class="epitaph" id="previewEpitaph"></div>
      <div class="rip">REST IN PEACE</div>
    </div>
    <div class="bgm" id="bgmCard" hidden>
      <div class="label">함께 들어주세요</div>
      <div class="song">
        <img id="bgmArt" alt="">
        <div class="meta">
          <div class="title" id="bgmTitle"></div>
          <div class="artist" id="bgmArtist"></div>
        </div>
        <button type="button" class="play" id="playBtn" aria-label="미리듣기 재생">▶</button>
      </div>
      <audio id="audio" preload="none"></audio>
      <iframe class="player" id="bgmPlayer" title="BGM 재생" hidden
        allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen
        referrerpolicy="strict-origin-when-cross-origin"></iframe>
      <div class="links">
        <span class="label" id="previewNote">30초 미리듣기</span>
        <a id="fullLink" target="_blank" rel="noopener">유튜브에서 전곡 듣기 ›</a>
      </div>
    </div>
    <div class="locked" id="locked" hidden>🔒 <span id="lockedText"></span></div>
    <div class="card" id="myGift" hidden>
      <div class="label" id="myGiftLabel"></div>
      <div class="text" id="myGiftText"></div>
    </div>
  </section>

  <form id="friendForm" hidden>
    <div class="field">
      <label for="fromName">내 이름</label>
      <input id="fromName" maxlength="20" placeholder="친구가 알아볼 이름" autocomplete="name">
    </div>
    <div class="field">
      <label for="friendEpitaph"><span id="friendEpitaphLabel">묘비명</span> <span class="count" id="friendCount">0 / 50</span></label>
      <textarea id="friendEpitaph" maxlength="50" placeholder="늘 먼저 웃어주던 사람."></textarea>
    </div>
  </form>

  <section id="inbox" hidden>
    <h2>친구들이 남겨준 묘비명</h2>
    <ul class="gifts" id="gifts"></ul>
  </section>

  <form id="form">
    <div class="field">
      <label for="name">이름</label>
      <input id="name" maxlength="20" placeholder="홍길동" autocomplete="name">
    </div>
    <div class="field">
      <label for="epitaph">묘비명 <span class="count" id="count">0 / 50</span></label>
      <textarea id="epitaph" maxlength="50" placeholder="잘 놀다 갑니다."></textarea>
    </div>
    <div class="field">
      <label for="search">좋아하는 BGM</label>
      <input id="search" type="search" placeholder="곡 제목이나 가수 검색" autocomplete="off">
      <p class="help" id="searchHelp">검색해서 고르면 바로 들어볼 수 있어요.</p>
      <ul class="results" id="results"></ul>
      <div class="picked song" id="picked" hidden>
        <img id="pickedArt" alt="">
        <div class="meta">
          <div class="title" id="pickedTitle"></div>
          <div class="artist" id="pickedArtist"></div>
        </div>
        <button type="button" class="text-btn" id="clearSong">빼기</button>
      </div>
    </div>
    <div class="field">
      <label for="bgmUrlInput">전곡 유튜브 링크 <span class="count">선택</span></label>
      <input id="bgmUrlInput" inputmode="url" placeholder="https://youtu.be/...">
      <p class="help" id="bgmHelp">넣으면 미리듣기 대신 유튜브로 전곡이 재생돼요.</p>
    </div>
  </form>
</main>

<div class="cta">
  <p class="status" id="status"></p>
  <button type="button" class="weak" id="share" disabled>친구에게 공유하기</button>
  <button type="submit" form="form" id="save" disabled>묘비명 남기기</button>
  <button type="button" id="give" hidden disabled>묘비명 남겨주기</button>
  <button type="button" id="sendBack" hidden></button>
  <button type="button" class="weak" id="makeMine" hidden>나도 묘비명 남기기</button>
</div>

<script>
  const KEY = "last-dancing-epitaph";
  const $ = (id) => document.getElementById(id);
  const nameEl = $("name"), epitaphEl = $("epitaph"), bgmUrlEl = $("bgmUrlInput"), audio = $("audio");
  let song = null; // { title, artist, art, preview }
  let currentVideo = null;

  function youtubeId(url) {
    try {
      const u = new URL(url.trim());
      const host = u.hostname.replace(/^(www|m|music)\./, "");
      let id = null;
      if (host === "youtu.be") id = u.pathname.slice(1);
      else if (host === "youtube.com") {
        id = u.searchParams.get("v") || (u.pathname.match(/^\/(shorts|embed|live)\/([^/]+)/) || [])[2];
      }
      return id && /^[\w-]{11}$/.test(id) ? id : null;
    } catch { return null; }
  }

  // 공유 링크: 내용을 URL # 뒤에 담아 서버 없이 전달
  function encode(data) {
    const bytes = new TextEncoder().encode(JSON.stringify(data));
    return btoa(String.fromCharCode(...bytes)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  function decode(str) {
    const bin = atob(str.replace(/-/g, "+").replace(/_/g, "/"));
    return JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, (c) => c.charCodeAt(0))));
  }

  // 노래 검색: iTunes Search API (키 불필요, 30초 미리듣기 제공). KR 스토어는 음악 결과가 없어 US 사용
  let searchTimer, searchSeq = 0;
  async function searchSongs(term) {
    const seq = ++searchSeq;
    if (!term) { $("results").innerHTML = ""; return; }
    $("searchHelp").textContent = "찾는 중이에요…";
    $("searchHelp").classList.remove("error");
    try {
      const res = await fetch(`https://itunes.apple.com/search?country=US&media=music&entity=song&limit=6&term=${encodeURIComponent(term)}`);
      const { results } = await res.json();
      if (seq !== searchSeq) return;
      const list = results.filter((r) => r.previewUrl);
      $("searchHelp").textContent = list.length ? "들려주고 싶은 노래를 골라주세요." : "검색 결과가 없어요. 다른 말로 찾아보세요.";
      $("results").replaceChildren(...list.map((r) => {
        const s = { title: r.trackName, artist: r.artistName, art: r.artworkUrl100, preview: r.previewUrl };
        const li = document.createElement("li");
        li.innerHTML = `<button type="button" class="song"><img alt=""><div class="meta"><div class="title"></div><div class="artist"></div></div></button>`;
        li.querySelector("img").src = s.art;
        li.querySelector(".title").textContent = s.title;
        li.querySelector(".artist").textContent = s.artist;
        li.querySelector("button").addEventListener("click", () => pickSong(s));
        return li;
      }));
    } catch {
      if (seq !== searchSeq) return;
      $("searchHelp").textContent = "검색이 안 돼요. 인터넷 연결을 확인해 주세요.";
      $("searchHelp").classList.add("error");
    }
  }

  function pickSong(s) {
    song = s;
    $("search").value = "";
    $("results").innerHTML = "";
    $("searchHelp").textContent = "검색해서 고르면 바로 들어볼 수 있어요.";
    render();
  }

  function data() {
    return { name: nameEl.value.trim(), epitaph: epitaphEl.value.trim(), song, bgmUrl: bgmUrlEl.value.trim() };
  }

  function renderPreview(d) {
    $("previewName").textContent = d.name || "이름";
    $("previewName").classList.toggle("placeholder", !d.name);
    $("previewEpitaph").textContent = d.epitaph || "여기에 묘비명이 새겨져요";
    $("previewEpitaph").classList.toggle("placeholder", !d.epitaph);

    const id = d.bgmUrl ? youtubeId(d.bgmUrl) : null;
    const s = d.song;
    $("bgmCard").hidden = !s && !id;
    $("bgmArt").hidden = !s;
    if (s) $("bgmArt").src = s.art;
    $("bgmTitle").textContent = s ? s.title : "유튜브 노래";
    $("bgmArtist").textContent = s ? s.artist : "";
    // 유튜브 링크가 있으면 전곡 재생, 없으면 30초 미리듣기
    $("playBtn").hidden = !s || !!id;
    $("previewNote").hidden = !s || !!id;
    $("bgmPlayer").hidden = !id;
    if (s && !id && audio.src !== s.preview) { audio.pause(); audio.src = s.preview; }
    if (id) audio.pause();
    if (id !== currentVideo) {
      currentVideo = id;
      $("bgmPlayer").src = id ? `https://www.youtube.com/embed/${id}` : "about:blank";
    }
    $("fullLink").href = id
      ? `https://www.youtube.com/watch?v=${id}`
      : `https://www.youtube.com/results?search_query=${encodeURIComponent(s ? `${s.artist} ${s.title}` : "")}`;
    $("fullLink").textContent = id ? "유튜브에서 보기 ›" : "유튜브에서 전곡 듣기 ›";
  }

  $("playBtn").addEventListener("click", () => { audio.paused ? audio.play() : audio.pause(); });
  audio.addEventListener("play", () => { $("playBtn").textContent = "❚❚"; $("playBtn").setAttribute("aria-label", "일시정지"); });
  ["pause", "ended"].forEach((ev) => audio.addEventListener(ev, () => { $("playBtn").textContent = "▶"; $("playBtn").setAttribute("aria-label", "미리듣기 재생"); }));

  function render() {
    const d = data();
    renderPreview(d);
    $("picked").hidden = !song;
    if (song) {
      $("pickedArt").src = song.art;
      $("pickedTitle").textContent = song.title;
      $("pickedArtist").textContent = song.artist;
    }
    $("count").textContent = `${epitaphEl.value.length} / 50`;
    const badUrl = d.bgmUrl && !youtubeId(d.bgmUrl);
    bgmUrlEl.classList.toggle("invalid", badUrl);
    $("bgmHelp").classList.toggle("error", badUrl);
    $("bgmHelp").textContent = badUrl
      ? "유튜브 링크가 아닌 것 같아요. 주소를 다시 확인해 주세요."
      : "넣으면 미리듣기 대신 유튜브로 전곡이 재생돼요.";
    $("save").disabled = $("share").disabled = !d.epitaph || badUrl;
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(data()));
      return true;
    } catch { return false; }
  }

  const baseUrl = () => location.href.split("#")[0];

  // 친구에게는 내 묘비명을 숨긴 채 보내고, 친구가 묘비명을 남겨줘야 열린다
  function share() {
    save();
    const d = data();
    return sendShare(
      [`${d.name || "내"} 묘비명을 지어줘.`, "남겨주면 내가 스스로 쓴 묘비명을 보여줄게."],
      `${baseUrl()}#m=${encode(d)}`,
    );
  }

  async function sendShare(lines, link) {
    // 내 컴퓨터 파일(file://)은 친구가 열 수 없으니, 웹에 올렸을 때만 링크를 넣는다
    const online = location.protocol.startsWith("http");
    const text = lines.join("\n") + (online ? `\n\n${link}` : "");

    if (navigator.share) {
      try {
        await navigator.share(online ? { title: "묘비명 남기기", text: lines.join("\n"), url: link } : { title: "묘비명 남기기", text });
        $("status").textContent = "공유했어요";
        return;
      } catch (e) { if (e.name === "AbortError") return; }
    }
    try {
      await navigator.clipboard.writeText(text);
      $("status").textContent = "복사했어요. 카톡이나 메시지에 붙여넣어 보내주세요";
    } catch {
      prompt("아래 내용을 복사해서 보내주세요", text);
    }
  }

  // 친구들이 나에게 남겨준 묘비명 (#r= 링크로 도착)
  const GIFTS_KEY = "last-dancing-gifts";
  function loadGifts() {
    try { return JSON.parse(localStorage.getItem(GIFTS_KEY) || "[]"); } catch { return []; }
  }
  function receiveGift(g) {
    if (!g || !g.epitaph) return;
    const gifts = loadGifts();
    if (!gifts.some((x) => x.from === g.from && x.epitaph === g.epitaph)) {
      gifts.unshift(g);
      try { localStorage.setItem(GIFTS_KEY, JSON.stringify(gifts)); } catch {}
    }
    history.replaceState(null, "", baseUrl());
    $("status").textContent = `${g.from}님이 묘비명을 남겨줬어요`;
  }
  function renderInbox() {
    const gifts = loadGifts();
    $("inbox").hidden = !gifts.length;
    $("gifts").replaceChildren(...gifts.map((g) => {
      const li = document.createElement("li");
      li.className = "card";
      li.innerHTML = `<div class="label"></div><div class="text"></div>`;
      li.querySelector(".label").textContent = `${g.from}님이 남겨줌`;
      li.querySelector(".text").textContent = g.epitaph;
      return li;
    }));
  }

  // 친구가 내 공유 링크로 들어온 경우: 먼저 묘비명을 남겨줘야 내 묘비명이 열린다
  function showFriendView(owner) {
    const who = owner.name || "친구";
    const fromEl = $("fromName"), textEl = $("friendEpitaph");
    $("headline").textContent = `${who}님에게 묘비명을 남겨주세요`;
    $("subline").textContent = `${who}님을 어떻게 기억할지 한 줄로 적어주세요.`;
    $("lockedText").textContent = `남겨주면 ${who}님이 스스로 쓴 묘비명을 볼 수 있어요`;
    $("friendEpitaphLabel").textContent = `${who}님의 묘비명`;
    $("form").hidden = $("share").hidden = $("save").hidden = true;
    $("friendForm").hidden = $("locked").hidden = $("give").hidden = false;

    const update = () => {
      renderPreview({ name: owner.name, epitaph: textEl.value.trim(), song: null, bgmUrl: "" });
      $("friendCount").textContent = `${textEl.value.length} / 50`;
      $("give").disabled = !textEl.value.trim();
    };
    fromEl.addEventListener("input", update);
    textEl.addEventListener("input", update);
    $("friendForm").addEventListener("submit", (e) => e.preventDefault());
    update();

    $("give").addEventListener("click", () => {
      const gift = { from: fromEl.value.trim() || "익명", epitaph: textEl.value.trim(), at: Date.now() };
      $("friendForm").hidden = $("locked").hidden = $("give").hidden = true;
      $("headline").textContent = `${who}님이 스스로 남긴 묘비명이에요`;
      $("subline").textContent = owner.song || owner.bgmUrl ? "좋아하던 노래와 함께 기억해 주세요." : "이 말과 함께 기억해 주세요.";
      renderPreview(owner);
      $("myGift").hidden = false;
      $("myGiftLabel").textContent = "내가 남겨준 묘비명";
      $("myGiftText").textContent = gift.epitaph;
      $("status").textContent = `${who}님에게도 보내줘야 도착해요`;
      $("sendBack").textContent = `${who}님에게 보내기`;
      $("sendBack").hidden = $("makeMine").hidden = false;
      $("sendBack").addEventListener("click", () => sendShare(
        [`${who}님, 묘비명을 지어 보냈어요.`, `“${gift.epitaph}” - ${gift.from}`],
        `${baseUrl()}#r=${encode(gift)}`,
      ));
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
    $("makeMine").addEventListener("click", () => { location.href = baseUrl(); });
  }

  const hash = location.hash.match(/^#(m|r)=(.+)$/);
  let incoming = null;
  if (hash) { try { incoming = decode(hash[2]); } catch {} }

  if (hash && hash[1] === "m" && incoming) {
    showFriendView(incoming);
  } else {
    if (hash && hash[1] === "r") receiveGift(incoming);
    try {
      const saved = JSON.parse(localStorage.getItem(KEY) || "null");
      if (saved) {
        nameEl.value = saved.name || "";
        epitaphEl.value = saved.epitaph || "";
        bgmUrlEl.value = saved.bgmUrl || "";
        song = saved.song || null;
        if (!$("status").textContent) $("status").textContent = "저장된 묘비명을 불러왔어요";
      }
    } catch {}
    renderInbox();

    [nameEl, epitaphEl, bgmUrlEl].forEach((el) => el.addEventListener("input", render));
    $("search").addEventListener("input", (e) => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => searchSongs(e.target.value.trim()), 350);
    });
    $("clearSong").addEventListener("click", () => { audio.pause(); song = null; render(); });
    $("form").addEventListener("submit", (e) => {
      e.preventDefault();
      $("status").textContent = save() ? "묘비명을 남겼어요" : "이 브라우저에서는 저장할 수 없어요";
    });
    $("share").addEventListener("click", share);
    render();
  }
</script>
</body>
</html>
